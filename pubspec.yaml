name: advanced_background_locator
description: "Flutter plugin for location tracking that keeps running in the background (Android foreground service, iOS background location updates)."
version: 0.1.0
repository: "https://github.com/AbdurrahmanKaraoglu/advanced_background_locator.git"
issue_tracker: "https://github.com/AbdurrahmanKaraoglu/advanced_background_locator/issues"

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - location
  - background
  - geolocation

flutter:
  plugin:
    platforms:
      android:
        package: abdurrahmankaraoglu.app.advanced_background_locator
        pluginClass: BackgroundLocatorPlugin
      ios:
        pluginClass: BackgroundLocatorPlugin
